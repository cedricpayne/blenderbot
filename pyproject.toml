[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderbot"
version = "2.0.0"
description = "AI-powered 3D content generation using Claude and Blender"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
all = [
    "blenderbot[telegram]",
]

[project.scripts]
blenderbot = "cli:main"
blenderbot-telegram = "blenderbot.telegram_bot:main"

[tool.setuptools.packages.find]
include = ["blenderbot*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
